<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Desk Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="desk">

        <header class="planner-header">
            <h1>My Digital Desk Planner</h1>

            <div class="navigation">
                <button>← Día anterior</button>
                <span>{{ today.strftime("%B %d, %Y") }}</span>
                <button>Día siguiente →</button>
            </div>
        </header>

        <main class="planner">

            <!-- LEFT PAGE: YESTERDAY -->
            <section class="page yesterday">

                <h2>AYER</h2>
              <h3>{{ yesterday.strftime("%A, %B %d, %Y") }}</h3>

                <div class="section">
                    <h4>Lo que hice</h4>

                    <label><input type="checkbox" checked> Trabajo</label>
                    <label><input type="checkbox" checked> Revisar proyecto</label>
                    <label><input type="checkbox"> Llamar al mecánico</label>
                </div>

                <div class="section">
                    <h4>Pendiente</h4>

                    <p>→ Terminar tarea</p>
                    <p>→ Comprar refacción</p>
                </div>

                <div class="section notes">
                    <h4>Notas</h4>

                    <textarea placeholder="Notas del día anterior..."></textarea>
                </div>

            </section>

            <!-- RIGHT PAGE: TODAY -->
            <section class="page today">

                <h2>HOY</h2>
                <h3>{{ today.strftime("%A, %B %d, %Y") }}</h3>
                <div class="section">
                    <h4>Prioridades</h4>
                    <form method="POST">

    <div class="section">
        <h4>Prioridades</h4>

        <input
            type="text"
            name="priority1"
            placeholder="1. Prioridad principal"
            value="{{ planner['priority1'] if planner else '' }}"
        >

        <input
            type="text"
            name="priority2"
            placeholder="2. Segunda prioridad"
            value="{{ planner['priority2'] if planner else '' }}"
        >

        <input
            type="text"
            name="priority3"
            placeholder="3. Tercera prioridad"
            value="{{ planner['priority3'] if planner else '' }}"
        >

    </div>
                   
                </div>

                <div class="section">
                    <h4>Tareas de hoy</h4>

                    <label><input type="checkbox"> Trabajo</label>
                    <label><input type="checkbox"> Estudiar</label>
                    <label><input type="checkbox"> Proyecto de agenda</label>
                    <label><input type="checkbox"> Agregar tarea...</label>
                </div>

                <div class="section notes">
                    <h4>Notas</h4>

                        <div class="section notes">

        <h4>Notas</h4>

        <textarea
            name="notes"
            placeholder="Escribe aquí tus notas..."
        >{{ planner['notes'] if planner else '' }}</textarea>

    </div>

    <button type="submit">Guardar día</button>

</form>
                </div>

            </section>

        </main>

    </div>

</body>
</html>
